<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="CV Matcher logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Kampuotas „cyber“ skydas -->
  <path d="M32 3 L55 15 V37 Q55 49 32 61 Q9 49 9 37 V15 Z"
        stroke="url(#g)" stroke-width="2.2" fill="#07120d" filter="url(#glow)"/>
  <!-- Terminalo raginimas „>“ -->
  <path d="M20 24 L28 32 L20 40" stroke="url(#g)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Atitikimo varnelė -->
  <path d="M31 38 L37 44 L47 26" stroke="#00e5ff" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- „Matrix“ taškai -->
  <circle cx="32" cy="12" r="1.3" fill="#00ff9c"/>
  <circle cx="32" cy="52" r="1.3" fill="#00e5ff"/>
</svg>
